<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Abhinav AV | AI & Data Science portfolio" />
    <meta name="theme-color" content="#060010" />
    <title>Abhinav AV | AI & Data Science</title>
    <style>
      :root {
        --bg: #060010;
        --text: #f3f4f6;
        --muted: #a1a1aa;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        font-family: Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        display: grid;
        place-items: center;
        min-height: 100vh;
      }

      main {
        text-align: center;
        padding: 2rem;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 4rem);
        letter-spacing: 0.04em;
      }

      p {
        margin-top: 0.5rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Abhinav AV</h1>
      <p>AI &amp; Data Science Portfolio</p>
    </main>
  </body>
</html>
